# enable bluetooth
CONFIG_BT=y

# enable deep sleep support
CONFIG_ZMK_SLEEP=y

# ============================================================================
#  SUPERMINI nRF52840 SLEEP-CURRENT LEAK FIX  (Option A: firmware-only)
# ============================================================================
#  WHAT THE PROBLEM IS
#  -------------------
#  The cheap "SuperMini / ProMicro NRF52840" boards (nice!nano v2 clones)
#  from early batches carry a 5.6K pull-up resistor that ties the VCC-cutoff
#  control pin (P0.13, which ZMK calls EXT_POWER) to VDDH (the battery rail).
#
#  When that pin is driven LOW, the resistor effectively shorts VDDH to GND:
#        3.6 V / 5.6K  ~=  650 uA  of constant leak.
#  Newer batches (post ~April 2024) swapped it for 10M or 500K-600K, which is
#  why only some boards / orders show this.
#
#  WHY IT ONLY LEAKS *WHILE SLEEPING*
#  ----------------------------------
#  On boot ZMK's external-power driver ENABLES VCC (P0.13 HIGH), so there is
#  no voltage across the pull-up and therefore no leak.
#  But with CONFIG_ZMK_SLEEP=y, the power-management code (see ZMK's
#  app/src/pm.c -> zmk_pm_suspend_devices) SUSPENDS every device when the
#  keyboard enters deep sleep. The external-power driver's suspend handler
#  (app/src/ext_power_generic.c, PM_DEVICE_ACTION_SUSPEND) drives P0.13 LOW
#  to cut VCC. That is precisely what turns the 5.6K resistor into a 650 uA
#  short. Wake the board and it is re-enabled, so the drain appears only in
#  sleep -- exactly the symptom being fixed here.
#
#  THE WORKAROUND
#  --------------
#  Disable ZMK's external-power support entirely. The ext_power driver source
#  is only compiled when CONFIG_ZMK_EXT_POWER is set (app/CMakeLists.txt), so
#  turning it off means:
#    * ZMK never drives P0.13 at all (no init, no sleep-time suspend call),
#    * the pin is left as a floating input, held HIGH by the 5.6K pull-up,
#    * with P0.13 HIGH the resistor has ~0 V across it -> no leak,
#    * the 3.3 V VCC rail simply stays enabled.
#
#  TRADE-OFFS (acceptable for THIS keyboard)
#  -----------------------------------------
#    * The 3.3 V "VCC" rail is now always on. That is fine here because the
#      Urchin has no display and no RGB/peripheral load on VCC (the display
#      section further down in this file is disabled). With no load it only
#      costs the regulator's quiescent current instead of the 650 uA short.
#    * The &ext_power behavior becomes unavailable. This keymap does not use
#      it, so nothing breaks.
#    * Battery reporting is unaffected: nice_nano_v2 measures the battery on
#      the VDDH pin, not through the external-power circuit.
#
#  IF YOU WANT THE *BEST* RESULT
#  -----------------------------
#  The real fix is hardware: desolder that 5.6K pull-up (or replace it with
#  10M). That restores proper VCC cutoff AND removes the leak, getting deep
#  sleep under ~20 uA. This config change is the no-soldering alternative.
#
#  Related leftovers worth checking if you still measure current after this:
#    * A few late batches use a plain silicon diode at position "W5" instead
#      of a Schottky (BAT60B): that alone can leak ~60 uA. (sasodoma/
#      nrf52840-promicro)
#    * CONFIG_BOARD_ENABLE_DCDC_HV defaults to "n" on ZMK v0.3.0, so the
#      separate high-voltage DC/DC clone issue (zmk issue #2990) does NOT
#      apply until this repo is updated to a newer ZMK.
# ============================================================================
CONFIG_ZMK_EXT_POWER=n

# enable pointing device
# https://zmk.dev/docs/keymaps/behaviors/mouse-emulation
CONFIG_ZMK_POINTING=y

# the keyboard disconnects from bluetooth.
# uses very little power, but it may take
# a few seconds to reconnect after waking.
# 900.000 ms = 15 minutes (ZMK default)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Peripheral Battery Monitoring
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# "Eager Debouncing"
# Trying to lower the input lag.
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# --- DISPLAY SETTINGS ---

# enable display
#CONFIG_ZMK_DISPLAY=n
# custom status screen (nice-view-gem)
#CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=n
# turn off gem animation to save battery
#CONFIG_NICE_VIEW_GEM_ANIMATION=n

